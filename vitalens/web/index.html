<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My VitaLens</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap">
<style>
/* Layout: a calm personal health app. One column of cards on phones, two columns on wide screens.
   Home = what changed + body map + areas; Area = one topic in depth; Ask = chat; Visit = doctor summary. */
:root{
  --bg:#F3F6F5; --card:#FFFFFF; --ink:#18292B; --muted:#5A6C6F; --line:#DCE5E4;
  --accent:#127A74; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --worse:#B5502B; --worse-soft:#FBEAE2; --watch:#9A6B10; --watch-soft:#FAF0D9;
  --better:#2E7A4A; --better-soft:#E3F2E8; --steady:#4F6C70; --steady-soft:#E8EFEF;
  --skin:#E6EEED; --skin-line:#C9D7D5;
  --head:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1817; --card:#152221; --ink:#E3EEEC; --muted:#9AB0AD; --line:#26393A;
  --accent:#5CC8BE; --accent-ink:#0E1817; --accent-soft:#17383A; --worse:#F0956E; --worse-soft:#3D2419;
  --watch:#E5BD62; --watch-soft:#382D14; --better:#7CCB97; --better-soft:#183324; --steady:#9DB7BA; --steady-soft:#1E2E30;
  --skin:#1D2E2E; --skin-line:#2E4546; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1817; --card:#152221; --ink:#E3EEEC; --muted:#9AB0AD; --line:#26393A;
  --accent:#5CC8BE; --accent-ink:#0E1817; --accent-soft:#17383A; --worse:#F0956E; --worse-soft:#3D2419;
  --watch:#E5BD62; --watch-soft:#382D14; --better:#7CCB97; --better-soft:#183324; --steady:#9DB7BA; --steady-soft:#1E2E30;
  --skin:#1D2E2E; --skin-line:#2E4546; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
.page{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(24px,4.6vw,32px);line-height:1.2} h2{font-size:20px;line-height:1.3} h3{font-size:17px}
p{margin:0} button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-area]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14.5px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--head);font-weight:600;font-size:21px}
.logo b{color:var(--accent);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
.s-worse{background:var(--worse-soft);color:var(--worse)} .s-watch{background:var(--watch-soft);color:var(--watch)}
.s-better{background:var(--better-soft);color:var(--better)} .s-steady{background:var(--steady-soft);color:var(--steady)}
.s-nodata{border:1px solid var(--line);color:var(--muted)}

.login{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.login input:not([type=checkbox]){background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.login .show{display:flex;gap:8px;align-items:center}
.login .btn{margin-top:6px;padding:11px}
.err{color:var(--worse);font-weight:700;min-height:1.2em}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.person{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.person:hover{border-color:var(--accent)}
.person b{font-family:var(--head);font-size:17px;font-weight:500}
.idrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.idrow input{flex:1 1 180px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-transform:uppercase}

.hello{display:flex;flex-direction:column;gap:6px}
.noticed{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.noticed li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.noticed li button:hover{border-color:var(--accent)}
@media (max-width:520px){.noticed li button{grid-template-columns:auto minmax(0,1fr)}.noticed li button .pill{grid-column:2;justify-self:start}}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.d-worse{background:var(--worse)} .d-watch{background:var(--watch)} .d-better{background:var(--better)} .d-steady{background:var(--steady)} .d-nodata{border:2px solid var(--muted)}
.explain{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.aiout{margin-top:10px;line-height:1.75;white-space:pre-wrap}
.aiout.wait{color:var(--muted);font-style:italic}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding:0;list-style:none}
.checks li{font-size:12.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.checks li.ok{color:var(--better);border-color:var(--better)} .checks li.bad{color:var(--worse);border-color:var(--worse)}
.src{font-size:12.5px;color:var(--muted);margin-top:6px}
.src.aierr{color:var(--worse);font-size:14px;font-weight:700}

.bodywrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
@media (max-width:520px){.bodywrap{grid-template-columns:110px minmax(0,1fr);gap:10px}}
.bodymap svg{width:100%;height:auto;display:block}
.hot{cursor:pointer}
.hot circle.ring{fill:none;stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){.hot.pulse circle.ring{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}}
.areas{display:flex;flex-direction:column;gap:8px;min-width:0}
.area{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.area:hover{border-color:var(--accent)}
.area .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;flex-wrap:wrap}
.area .s{font-size:14px;color:var(--muted)}

.meds{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.meds li{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.low{background:var(--watch)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14.5px;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.notes{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.notes li{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:15px}
.notes li button{border:0;background:none;color:var(--muted)}
.addnote{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addnote input{flex:1 1 200px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}

.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-height:440px;overflow:auto}
.chat:empty{display:none}
.msg{border-radius:14px;padding:10px 14px;max-width:88%;white-space:pre-wrap;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg.ai.wait{color:var(--muted);font-style:italic}
.msg .checks{margin-top:8px;white-space:normal}
.askrow{display:flex;gap:8px;margin-top:12px}
.askrow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.qs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.qs label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.qs input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.summary{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;margin:10px 0 0;max-height:300px;overflow:auto;font-family:var(--body)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .n{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tile .v{font-family:var(--head);font-size:26px;font-weight:500;line-height:1.15}
.tile .v small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400}
.tile .u{font-size:14px;color:var(--muted)}
.tile .what{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.tile svg{width:100%;height:auto;display:block;margin-top:4px}
.say{font-size:18px;line-height:1.6;margin-top:10px;max-width:65ch}
.disc{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
footer{font-size:13px;color:var(--muted);text-align:center}
footer a{color:var(--accent)}
/* ---- v1.0: control, emergency card, check-in, sources ---- */
.own{border-color:var(--accent)}
.own .lede{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.shareform{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.shareform input,.shareform select,.cform input,.remrow input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.shareform input{flex:1 1 160px}
.links{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}.links li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.links .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.links .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:6px 10px;font-size:14px}.btn.danger{color:var(--worse)}
.qrbox{margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.qrbox img{width:150px;height:150px;background:#fff;border-radius:8px;padding:4px}
.urlbox{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg);border-radius:8px;padding:6px 8px}
.log{list-style:none;margin:10px 0 0;padding:0;max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log .ic{font-size:15px}.log .h{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
.chain{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.chain.ok{background:var(--better-soft);color:var(--better)}.chain.bad{background:var(--worse-soft);color:var(--worse)}
.emerg{border-color:#E8B4B4}.emerg h2:before{content:"✚ ";color:#C62828}
.dosegrid{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}.dosegrid li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dosebtns{display:flex;gap:6px;margin-top:6px}.dosebtns .btn[aria-pressed="true"].take{background:var(--better);color:#fff;border-color:var(--better)}.dosebtns .btn[aria-pressed="true"].miss{background:var(--worse);color:#fff;border-color:var(--worse)}
.strip{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.strip i{width:16px;height:16px;border-radius:5px;background:var(--line);display:block}.strip i.t{background:var(--better)}.strip i.m{background:var(--worse)}.strip i.today{outline:2px solid var(--accent);outline-offset:1px}
.remrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sup{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;font-weight:700;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:0;padding:0 4px;margin-left:3px;vertical-align:super;cursor:pointer}
.facts{margin:10px 0 0;padding:8px 10px 8px 28px;border-left:3px solid var(--accent-soft);font-size:13px;color:var(--muted)}.facts li.hl{color:var(--ink);background:var(--accent-soft);border-radius:6px}
.facts-t{font-size:12px;font-weight:700;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}
dialog#modal{border:0;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}dialog#modal::backdrop{background:rgba(0,0,0,.45)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.mbody{padding:16px 18px;display:grid;gap:14px}
.cform{display:grid;gap:8px}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
/* ---- v1.1: cleaner layout, tabs, three health checks first, documents ---- */
:root{--bg:#F5F7F7;--line:#E3EAE9;--shadow:0 1px 2px rgba(20,45,45,.04),0 6px 20px rgba(20,45,45,.05);--radius:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1615;--card:#131F1E;--line:#22302F;--shadow:none}}
:root[data-theme="dark"]{--bg:#0D1615;--card:#131F1E;--line:#22302F;--shadow:none}
body{font-size:16.5px}
.page{max-width:1160px;gap:18px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.card h2{margin-bottom:2px}.card>.small.muted{margin-bottom:12px}
.btn{border-radius:10px;padding:8px 14px}.btn.primary{box-shadow:none}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:var(--bg);scrollbar-width:none;margin-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 14px;font-weight:600;font-size:15.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--ink)}.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.hero{padding:6px 2px 0}.hero h1{margin:4px 0 6px}.eyebrow{font-size:13.5px;color:var(--muted);letter-spacing:.01em}
.scen-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:960px){.scen-grid{grid-template-columns:minmax(0,1fr)}}
.scard{--c:var(--steady);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;min-width:0}
.scard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,45,45,.09)}
.scard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scard.c-worse{--c:var(--worse)}.scard.c-watch{--c:var(--watch)}.scard.c-better{--c:var(--better)}.scard.c-steady{--c:var(--steady)}
.scard.c-na{--c:var(--line);cursor:default;box-shadow:none;background:transparent}.scard.c-na:hover{transform:none;box-shadow:none}
.scard-top{display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-start}.scard h3{font-size:18px;line-height:1.3}
.counts{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:700}
.counts span{border-radius:8px;padding:2px 9px}.cw{background:var(--worse-soft);color:var(--worse)}.cb{background:var(--better-soft);color:var(--better)}.ct{background:var(--watch-soft);color:var(--watch)}
.evs{list-style:none;margin:0;padding:0}
.ev{display:flex;justify-content:space-between;gap:10px;padding:7px 0 7px 12px;border-top:1px solid var(--line);font-size:15px;position:relative}
.ev:before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;border-radius:50%;transform:translateY(-50%);background:var(--steady)}
.ev-worse:before{background:var(--worse)}.ev-better:before{background:var(--better)}.ev-watch:before{background:var(--watch)}
.ev b{font-weight:600;text-align:right;max-width:62%}.ev-worse b{color:var(--worse)}.ev-better b{color:var(--better)}
.scard .target{color:var(--watch);margin-top:-4px}.scard .more{font-weight:700;color:var(--accent);font-size:14.5px;margin-top:auto}
.pill.big{font-size:15px;padding:5px 14px}
.area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.area{background:var(--card)}.area:hover{border-color:var(--accent)}
.why{list-style:none;margin:8px 0 0;padding:0}.why li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tiles{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))!important}
.drop{position:relative;display:block;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg);transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.docmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.docmeta input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.docmeta #doctitle{flex:1 1 220px}
.doclist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.doclist li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.doclist li.empty{border-style:dashed;justify-content:center;padding:18px}
.dico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;flex:none}
.dico.pdf{background:var(--worse-soft);color:var(--worse)}.dico.img{background:var(--accent-soft);color:var(--accent)}

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS=Array.from({length:12},(_,i)=>({m:(8+i)%12}));
const W0=Date.UTC(2025,8,1),W1=Date.UTC(2026,8,1);
const t2=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d||1)};
const fmtM=s=>{if(!s)return"";const [y,m]=s.split("-").map(Number);return `${MONL[m-1]} ${y}`};
const n1=(v,d=1)=>v==null?"–":(Math.abs(v)>=1000?Math.round(v).toLocaleString("en-US"):(+v).toFixed(d));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- plain-language dictionary ---------- */
const NAMES={sbp:"Blood pressure (top number)",dbp:"Blood pressure (bottom number)",rhr:"Resting heart rate",hrv:"Heart rate variability",sleep:"Sleep",stress:"Stress score",steps:"Daily steps",active:"Active minutes",sedentary:"Sitting time",weight:"Weight",
  "HbA1c":"HbA1c (3-month blood sugar)","Fasting glucose":"Morning blood sugar","LDL cholesterol":"LDL ('bad' cholesterol)","HDL cholesterol":"HDL ('good' cholesterol)","Triglycerides":"Triglycerides (blood fats)","Total cholesterol":"Total cholesterol",
  "TSH":"TSH (thyroid signal)","Free T4":"Free T4 (thyroid hormone)","Hemoglobin":"Hemoglobin (red blood cells)","Ferritin":"Ferritin (iron stores)","Vitamin D":"Vitamin D","Vitamin B12":"Vitamin B12"};
const WHAT={sbp:"The pressure in your arteries when your heart beats, from your home cuff. Under 130 is the usual target.",
  dbp:"The pressure between heartbeats. Under 80 is the usual target.",rhr:"How many times your heart beats in a minute while you rest. Lower usually means your heart works easily.",
  hrv:"Tiny differences in time between heartbeats. Higher usually means your body is well rested.",sleep:"Hours of sleep each night, from your watch or band.",
  stress:"Your watch's stress score. Lower is calmer.",steps:"Steps you walk each day.",active:"Minutes each day you were moving briskly.",sedentary:"Hours each day spent sitting.",weight:"Your weight from the smart scale.",
  bp:"How often your home blood pressure was 130/80 or higher. Fewer days is better.",
  "HbA1c":"Your average blood sugar over the last 2–3 months. Under 5.7% is the normal range.","Fasting glucose":"Your blood sugar after not eating overnight.",
  "LDL cholesterol":"The cholesterol that can build up in blood vessels. Lower is better.","HDL cholesterol":"The cholesterol that helps clear the bad kind. Higher is better.",
  "Triglycerides":"A type of fat in your blood. Lower is better.","Total cholesterol":"All the cholesterol in your blood.","TSH":"A signal from your brain telling the thyroid how hard to work.",
  "Free T4":"The main thyroid hormone, which sets your body's energy speed.","Hemoglobin":"Carries oxygen in red blood cells. Low can make you tired.","Ferritin":"How much iron your body has stored.",
  "Vitamin D":"Helps bones and muscles. Low is common in Canadian winters.","Vitamin B12":"Helps nerves and blood cells."};
const GOODUP=new Set(["hrv","sleep","steps","active"]);
const MEDWHY={"Metformin":"helps your body use sugar","Metformin XR":"helps your body use sugar","Atorvastatin":"lowers cholesterol","Amlodipine":"lowers blood pressure","Levothyroxine":"replaces thyroid hormone","Ferrous sulfate":"iron tablet","Cholecalciferol":"vitamin D supplement","Vitamin D3":"vitamin D supplement","Sumatriptan":"for migraines","Pantoprazole":"reduces stomach acid","Budesonide/formoterol":"asthma inhaler"};

/* ---------- areas of the body ---------- */
const AREAS={
  sugar:{name:"Blood sugar",intro:"How well your body keeps the sugar in your blood steady.",sig:[],labs:["HbA1c","Fasting glucose"],meds:["Metformin","Metformin XR"],sym:["Increased thirst","Frequent urination"],x:100,y:180,
    qs:["Should I repeat my HbA1c test soon?","Is my diabetes medicine working for me?","What changes would help my blood sugar most?"]},
  heart:{name:"Heart & blood pressure",intro:"Your heart, blood pressure and the fats in your blood.",sig:["sbp","dbp","rhr","hrv"],bp:true,labs:["LDL cholesterol","HDL cholesterol","Triglycerides","Total cholesterol"],meds:["Amlodipine","Atorvastatin"],sym:["Dizziness"],x:114,y:126,
    qs:["Is my blood pressure where it should be?","Is my cholesterol medicine working?","How often should I check my blood pressure at home?"]},
  sleep:{name:"Sleep & stress",intro:"How you sleep and how stressed your body is.",sig:["sleep","stress"],labs:[],meds:["Sumatriptan"],sym:["Poor sleep","Headache","Migraine headache"],x:100,y:38,
    qs:["Could my sleep be affecting my other results?","What can I do about stress?"]},
  thyroid:{name:"Thyroid",intro:"The gland in your neck that sets your body's energy speed.",sig:[],labs:["TSH","Free T4"],meds:["Levothyroxine"],sym:[],x:100,y:76,qs:["Is my thyroid dose right for me?"]},
  cycle:{name:"Cycle",intro:"Your period cycle: how long and how regular it is.",sig:[],labs:[],meds:[],sym:["Menstrual cramps","Irregular cycle"],cycles:true,female:true,x:100,y:224,
    qs:["Are my long cycles something to look into?","Could my weight or sleep affect my cycle?"]},
  activity:{name:"Activity",intro:"How much you move during the day.",sig:["steps","active","sedentary"],labs:[],meds:[],sym:[],x:84,y:300,qs:["How much activity is right for me?"]},
  body:{name:"Weight & nutrition",intro:"Your weight, vitamins and iron.",sig:["weight"],labs:["Vitamin D","Vitamin B12","Hemoglobin","Ferritin"],meds:["Cholecalciferol","Vitamin D3","Ferrous sulfate"],sym:["Fatigue"],x:138,y:196,qs:["Is my weight change something to talk about?","Are my vitamin and iron levels OK now?"]}
};
const ORDER=["sugar","heart","sleep","thyroid","cycle","activity","body"];
const RANK=["worse","watch","better","steady","nodata"];
const STW={worse:"Getting worse",watch:"Worth a check",better:"Getting better",steady:"Steady",nodata:"No data"};

let P=null,view="login",areaKey=null;

/* ---------- one patient's data into plain findings ---------- */
function findings(k){
  const A=AREAS[k],out=[];
  A.sig.forEach(s=>{const t=P.trends[s];if(!t||t.baseline==null||t.recent==null)return;const ch=t.direction!=="stable";const up=t.change>0;
    const good=ch&&(GOODUP.has(s)?up:!up);out.push({kind:"sig",key:s,name:NAMES[s],now:t.recent,usual:t.baseline,unit:t.unit,dec:t.dec,monthly:t.monthly,tol:t.tol,
      state:!ch?"steady":good?"better":"worse",up})});
  if(A.bp&&P.bp_target&&P.bp_target.baseline!=null){const b=P.bp_target,d=b.recent-b.baseline;out.push({kind:"bp",key:"bp",name:"Days at or above 130/80",now:b.recent,usual:b.baseline,unit:"% of days",dec:0,monthly:b.monthly,tol:10,
    state:d>=10?"worse":d<=-10?"better":b.recent>=50?"watch":"steady",up:d>0})}
  A.labs.forEach(l=>{const L=P.labs[l];if(!L||L.last==null)return;const st=L.direction==="worse"?"worse":L.direction==="better"?(L.last_outside?"watch":"better"):L.last_outside?"watch":"steady";
    out.push({kind:"lab",key:l,name:NAMES[l]||l,now:L.last,usual:L.first,unit:L.unit,dec:L.unit==="%"?2:1,L,state:st,up:L.change>0})});
  return out;
}
function areaStatus(k){
  const A=AREAS[k];if(A.female&&P.sex!=="Female")return null;
  const f=findings(k);let has=f.length;
  if(A.cycles&&P.cycles)has++;
  if(A.meds.some(m=>P.meds.some(x=>x.medication===m)))has++;
  if(!has)return"nodata";
  if(f.some(x=>x.state==="worse"))return"worse";
  if(A.cycles&&P.cycles&&(P.cycles.mean>35||P.cycles.long>=2))return"watch";
  if(f.some(x=>x.state==="watch"))return"watch";
  if(f.some(x=>x.state==="better"))return"better";
  return"steady";
}
function sentence(f){
  const u=f.unit==="%"?"%":" "+f.unit;
  if(f.state==="steady")return `${f.name} stayed close to your usual (${n1(f.now,f.dec)}${u}).`;
  if(f.kind==="lab")return `${f.name} ${f.up?"went up":"went down"} from ${n1(f.usual,f.dec)} to ${n1(f.now,f.dec)}${u}`+(f.L.last_outside?`, outside the normal range (${f.L.ref}).`:".");
  return `${f.name}: ${n1(f.now,f.dec)}${u} recently, ${f.up?"up":"down"} from ${n1(f.usual,f.dec)} usually.`;
}
function areaLine(k){
  const st=areaStatus(k),f=findings(k);
  if(st==="nodata")return"No readings for this yet.";
  if(k==="cycle"&&P.cycles)return `Average cycle ${P.cycles.mean} days; ${P.cycles.long} of ${P.cycles.n} longer than 35 days.`;
  const top=f.find(x=>x.state===st)||f[0];return top?sentence(top):"Medicines on record, no test results yet.";
}

/* ---------- sign-in: each person gets only their own data ----------
   server mode (start_demo.bat): the server checks the password and sends back only that person's record.
   preview mode (published link, no server): a few demo accounts; each file is named by a hash of ID + password,
   so it can only be found by someone who knows that password. */
let MODE="server";
async function boot(){
  try{const r=await fetch("api/health",{cache:"no-store"});const j=r.ok?await r.json():null;MODE=j&&j.status==="ok"?"server":"preview";API_OK=!!(j&&j.provider&&j.provider!=="rule-based")}catch(e){MODE="preview"}
  if(MODE==="server"){try{const r=await fetch("api/me",{cache:"no-store"});if(r.ok){P=await r.json();return showMe()}}catch(e){}}
  else{const h=sessionGet();if(h){try{const r=await fetch(`preview/${h}.json`);if(r.ok){P=await r.json();return showMe()}}catch(e){}}}
  renderLogin();
}
function sessionGet(){try{return sessionStorage.getItem("vl-preview")}catch(e){return null}}
function sessionSet(v){try{v?sessionStorage.setItem("vl-preview",v):sessionStorage.removeItem("vl-preview")}catch(e){}}
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function showMe(){$("signout").hidden=false;$("who").hidden=false;$("who").textContent=`Signed in as ${P.id}`;view="home";render()}
async function signIn(id,pw){
  id=id.trim().toUpperCase();pw=pw.trim();if(!id||!pw)return "Enter your ID and password.";
  if(MODE==="server"){const r=await fetch("api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,password:pw})});
    if(!r.ok){const j=await r.json().catch(()=>({}));return j.detail||"Could not sign in."}
    const m=await fetch("api/me",{cache:"no-store"});if(!m.ok)return "Could not load your data.";P=await m.json()}
  else{const h=await sha256(`${id}:${pw}`);const r=await fetch(`preview/${h}.json`);if(!r.ok)return "That ID and password don't match.";P=await r.json();sessionSet(h)}
  showMe();return null;
}
async function signOut(){if(MODE==="server"){try{await fetch("api/logout",{method:"POST"})}catch(e){}}else sessionSet(null);
  P=null;$("signout").hidden=true;$("who").hidden=true;renderLogin();window.scrollTo({top:0})}

function sparkSVG(f){

    band=[f.L.lo??Math.min(...vs),f.L.hi??Math.max(...vs)];lo=Math.min(...vs,band[0]);hi=Math.max(...vs,band[1])}

  if(!pts.length)return"";

  [0,3,6,9].forEach(i=>{s+=`<text x="${X(i/12)}" y="${Hd-4}" font-size="10" fill="var(--muted)">${MON[MONTHS[i].m]}</text>`});

}

const AILANG={en:["English","This is not a diagnosis. Please talk to your doctor about these results."],hi:["Hindi","यह कोई निदान नहीं है। कृपया इन परिणामों के बारे में अपने डॉक्टर से बात करें।"],gu:["Gujarati","આ કોઈ નિદાન નથી. કૃપા કરીને આ પરિણામો વિશે તમારા ડૉક્ટર સાથે વાત કરો."],es:["Spanish","Esto no es un diagnóstico. Hable con su médico sobre estos resultados."],fr:["French","Ceci n'est pas un diagnostic. Parlez de ces résultats avec votre médecin."]};

let API_OK=false;

function aiErr(e){const c=e&&e.code;

    <span class="acts"><button type="button" class="btn sm" data-qr="${esc(s.token)}">QR</button><button type="button" class="btn sm" data-copy="${esc(s.url)}">Copy link</button><button type="button" class="btn sm" data-newcode="${esc(s.token)}">New code</button><button type="button" class="btn sm danger" data-stop="${esc(s.token)}">Stop sharing</button></span></div>
    <div class="codeline" id="code-${esc(s.token)}" hidden></div>
    <div class="qrbox" id="qr-${esc(s.token)}" hidden><img alt="QR code for this link" src="api/me/shares/${esc(s.token)}/qr.svg"><div class="small" style="flex:1;min-width:180px">Your doctor scans this, or opens:<div class="urlbox">${esc(s.url)}</div></div></div></li>`).join("")||`<li class="small muted">No active links. Your record is private.</li>`}catch(e){}}
function codeHTML(code,label){return `<div class="codebox"><div><span class="small muted">Access code${label?` for ${esc(label)}`:""}</span><b class="code num">${esc(code.slice(0,3))} ${esc(code.slice(3))}</b></div>
  <p class="small">Tell your doctor this code <b>separately</b>: say it, or text it. Don't send it with the link. It's shown only now; you can make a new one any time.</p>
  <button type="button" class="btn sm" data-copy="${esc(code)}">Copy code</button></div>`}
let REQT=null;
async function loadRequests(){const el=$("reqs");if(!el){clearInterval(REQT);REQT=null;return}
  try{const l=await apiJSON("api/me/requests");
    el.innerHTML=l.map(r=>`<div class="reqbox" role="alert"><div><b>${esc(r.viewer)}</b> (${esc(r.role)}) wants to see your record<br><span class="small muted">Using your link "${esc(r.label)}" · ${esc(whenS(r.created))}. They entered the right access code.</span></div>
      <div class="acts"><button type="button" class="btn sm primary" data-approve="${esc(r.id)}">Approve</button><button type="button" class="btn sm danger" data-deny="${esc(r.id)}">Deny</button></div></div>`).join("")}catch(e){}}
async function loadLog(){try{const j=await apiJSON("api/me/log");const el=$("log");if(!el)return;
  $("chain").innerHTML=j.verify.ok?`<span class="chain ok" title="Each entry contains the fingerprint of the one before it. Editing or deleting any entry breaks the chain.">✓ Tamper-proof · ${j.verify.entries} entries</span>`:`<span class="chain bad">⚠ Log was altered at entry ${j.verify.broken_at}</span>`;
  el.innerHTML=j.entries.map(e=>`<li><span class="ic" aria-hidden="true">${LOGIC[e.action]||"•"}</span><span><b>${esc(e.actor)}</b> · ${esc(e.action.toLowerCase())}${e.detail?` <span class="muted">(${esc(e.detail)})</span>`:""}<br><span class="small muted">${esc(whenS(e.ts))}</span> <span class="h" title="Fingerprint of this entry">#${esc(e.hash.slice(0,10))}</span></span></li>`).join("")||`<li class="small muted">Nothing yet.</li>`}catch(e){}}

/* ---------- emergency travel card ---------- */
let EM=null;
function modal(title,html){let d=$("modal");if(!d){d=document.createElement("dialog");d.id="modal";document.body.append(d);const st=document.createElement("style");st.textContent=VLCard.CSS;document.head.append(st)}
  d.innerHTML=`<div class="mhead"><h2>${esc(title)}</h2><button type="button" class="btn sm" id="closemodal">Close</button></div><div class="mbody">${html}</div>`;if(!d.open)d.showModal()}
async function openEmergency(){try{EM=await apiJSON("api/me/emergency")}catch(e){alertBox(aiErr(e));return}showEmergency()}
function showEmergency(){const c=EM.card,l=EM.link,lang=store.get("vl-cardlang",$("lang").value);
  modal("Emergency travel card",`<label class="small">Card language <select id="cardlang" class="sel">${[["en","English"],["hi","हिन्दी"],["gu","ગુજરાતી"],["es","Español"],["fr","Français"]].map(([v,n])=>`<option value="${v}" ${v===lang?"selected":""}>${n}</option>`).join("")}</select></label>
    <div id="ecwrap">${VLCard.render(c,lang,lang==="en"?null:"en")}</div>
    <div class="qrbox"><img alt="QR code for your emergency card" src="api/me/shares/${esc(l.token)}/qr.svg"><div class="small" style="flex:1;min-width:200px"><b>Save this QR as your phone's lock-screen</b> or print it for your wallet. Anyone who scans it sees only this card.<div class="urlbox" style="margin-top:6px">${esc(l.url)}</div><div class="bar" style="margin-top:8px"><button type="button" class="btn sm" data-copy="${esc(l.url)}">Copy link</button><button type="button" class="btn sm danger" id="renewemerg">Replace QR (old one stops working)</button></div></div></div>
    <form class="cform" id="contactform"><b>Emergency contact</b><input id="cname" maxlength="80" placeholder="Name, e.g. Asha Patel (wife)" value="${esc(c.contact_name)}"><input id="cphone" maxlength="40" placeholder="Phone, e.g. +1 416 555 0100" value="${esc(c.contact_phone)}"><input id="cnote" maxlength="200" placeholder="Anything else, e.g. 'Speaks Gujarati and English'" value="${esc(c.note)}"><button class="btn primary" type="submit">Save</button><span class="small muted" id="cmsg"></span></form>`)}
function alertBox(t){modal("VitaLens",`<p>${esc(t)}</p>`)}

/* ---------- medicine check-in ---------- */
const dayStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const lastDays=n=>Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return dayStr(d)});
async function loadDoses(){const el=$("doses");if(!el)return;const days=lastDays(14),today=days.at(-1);
  try{const j=await apiJSON(`api/me/doses?since=${days[0]}`);const st={};j.log.forEach(x=>{st[x.med+"|"+x.day]=x.status});
    el.innerHTML=j.meds.map(m=>{const t=days.filter(d=>st[m.name+"|"+d]==="taken").length,logged=days.filter(d=>st[m.name+"|"+d]).length,s=st[m.name+"|"+today];
      return `<li><b>${esc(m.name)}</b> <span class="small muted">${esc(m.dose||"")} · ${esc(m.frequency||"")}</span>
        <div class="dosebtns"><button type="button" class="btn sm take" aria-pressed="${s==="taken"}" data-dose="${esc(m.name)}" data-st="taken">✓ Taken</button><button type="button" class="btn sm miss" aria-pressed="${s==="missed"}" data-dose="${esc(m.name)}" data-st="missed">Missed</button></div>
        <div class="strip" aria-label="Last 14 days">${days.map(d=>`<i class="${st[m.name+"|"+d]==="taken"?"t":st[m.name+"|"+d]==="missed"?"m":""} ${d===today?"today":""}" title="${d}: ${st[m.name+"|"+d]||"not logged"}"></i>`).join("")}</div>
        <div class="small muted" style="margin-top:4px">${logged?`Taken on ${t} of the ${logged} day${logged>1?"s":""} you logged in the last 2 weeks.`:"Nothing logged yet. Start today."}</div></li>`}).join("")||`<li class="small muted">No current medicines.</li>`}catch(e){el.innerHTML=`<li class="small muted">${esc(aiErr(e))}</li>`}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-area],[data-scen]");if(!b)return;
  if(b.id==="signout"){signOut();return}
  if(b.dataset.src){const [box,n]=b.dataset.src.split("-");const ol=$(box);if(ol){ol.querySelectorAll("li").forEach(li=>li.classList.toggle("hl",li.dataset.n===n));}return}
  if(b.dataset.qr){const q=$("qr-"+b.dataset.qr);if(q)q.hidden=!q.hidden;return}
  if(b.dataset.copy){navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy).then(()=>{const o=b.textContent;b.textContent="Copied ✓";setTimeout(()=>b.textContent=o,1500)},()=>{});return}
  if(b.dataset.approve||b.dataset.deny){const id=b.dataset.approve||b.dataset.deny;apiJSON("api/me/requests/"+encodeURIComponent(id),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({approve:!!b.dataset.approve})}).then(()=>{loadRequests();loadShares();loadLog()}).catch(e=>alertBox(aiErr(e)));return}
  if(b.dataset.newcode){const t=b.dataset.newcode;apiJSON(`api/me/shares/${encodeURIComponent(t)}/code`,{method:"POST"}).then(j=>{const el=$("code-"+t);if(el){el.hidden=false;el.innerHTML=codeHTML(j.code)}loadLog()}).catch(e=>alertBox(aiErr(e)));return}
  if(b.dataset.stop){apiJSON("api/me/shares/"+encodeURIComponent(b.dataset.stop),{method:"DELETE"}).then(()=>{loadShares();loadLog()}).catch(e=>alertBox(aiErr(e)));return}
  if(b.id==="openemerg"){openEmergency();return}
  if(b.id==="closemodal"){$("modal").close();loadLog();return}
  if(b.id==="renewemerg"){apiJSON("api/me/emergency/renew",{method:"POST"}).then(j=>{EM.link=j.link;showEmergency();loadLog()}).catch(e=>alertBox(aiErr(e)));return}
  if(b.dataset.dose){const on=b.getAttribute("aria-pressed")==="true";apiJSON("api/me/doses",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({med:b.dataset.dose,day:dayStr(new Date()),status:on?null:b.dataset.st})}).then(loadDoses).catch(e=>alertBox(aiErr(e)));return}
  if(b.id==="gosignup"){renderRegister();return}
  if(b.id==="golog"){renderLogin();return}
  if(b.id==="addmed"){$("medrows").insertAdjacentHTML("beforeend",medRow());return}
  if(b.id==="savefound"){saveFound();return}
  if(b.id==="dropfound"){$("found").innerHTML="";return}
  if(b.dataset.delres){if(!confirmDel(b))return;apiJSON("api/me/results/"+encodeURIComponent(b.dataset.delres),{method:"DELETE"}).then(async()=>{P=await apiJSON("api/me");loadResults()}).catch(e=>alertBox(aiErr(e)));return}
  if(b.dataset.tab){tab=b.dataset.tab;store.set("vl-tab",tab);view="home";render();return}
  if(b.dataset.scen){scenKey=b.dataset.scen;view="scenario";render();return}
  if(b.dataset.askscen){const k=b.dataset.askscen;tab="ai";store.set("vl-tab",tab);view="home";render();requestAnimationFrame(()=>doAsk(`How is my ${SC[k].name==="PCOS"?"PCOS":SC[k].name.toLowerCase()} health check going, and what does it mean?`));return}
  if(b.dataset.deldoc){if(!confirmDel(b))return;apiJSON("api/me/documents/"+encodeURIComponent(b.dataset.deldoc),{method:"DELETE"}).then(loadDocs).catch(e=>alertBox(aiErr(e)));return}
  if(b.dataset.area){areaKey=b.dataset.area;view="area";render();return}
  if(b.id==="home"){view="home";render();return}
  if(b.id==="explain"){doExplain();return}
  if(b.dataset.ask){doAsk(b.dataset.ask);return}
  if(b.dataset.askabout){const k=b.dataset.askabout;tab="ai";store.set("vl-tab",tab);view="home";render();requestAnimationFrame(()=>{doAsk(`What changed in my ${AREAS[k].name.toLowerCase()} and what does it mean?`)});return}
  if(b.dataset.note){const n=store.get("vl-notes-"+P.id,[]),i=n.findIndex(x=>x.t===b.dataset.note);if(i>=0)n.splice(i,1);else n.push({t:b.dataset.note,d:new Date().toISOString().slice(0,10)});store.set("vl-notes-"+P.id,n);b.setAttribute("aria-pressed",String(i<0));$("notes").innerHTML=notesHTML(n);return}
  if(b.dataset.delnote!=null){const n=store.get("vl-notes-"+P.id,[]);const gone=n.splice(+b.dataset.delnote,1)[0];store.set("vl-notes-"+P.id,n);$("notes").innerHTML=notesHTML(n);document.querySelectorAll("[data-note]").forEach(c=>{if(gone&&c.dataset.note===gone.t)c.setAttribute("aria-pressed","false")});return}
  if(b.id==="copysum"){const t=summaryText(),pre=$("summary");pre.hidden=false;pre.textContent=t;
    const ok=()=>{$("copymsg").textContent="Copied. Paste it into a note or message."};
    const no=()=>{try{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(_){}$("copymsg").textContent="Selected. Press Ctrl+C to copy."};
    try{navigator.clipboard.writeText(t).then(ok,no)}catch(err){no()}return}
});
document.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest("[data-area],[data-scen]");if(g&&g.tagName!=="BUTTON"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();if(g.dataset.scen){scenKey=g.dataset.scen;view="scenario"}else{areaKey=g.dataset.area;view="area"}render()}});
/* delete needs a second tap, so nothing is lost by accident (no browser pop-ups) */
function confirmDel(b){if(b.dataset.armed){return true}b.dataset.armed="1";const o=b.textContent;b.textContent="Tap again to delete";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o}},3000);return false}
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(!d)return;e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f){const dt=new DataTransfer();dt.items.add(f);$("docfile").files=dt.files;pickedFile(f)}});
document.addEventListener("submit",async e=>{e.preventDefault();
  if(e.target.id==="loginform"){const btn=$("lbtn");btn.disabled=true;$("lerr").textContent="";
    try{const err=await signIn($("lid").value,$("lpw").value);if(err){$("lerr").textContent=err;btn.disabled=false}}catch(x){$("lerr").textContent="Could not sign in. Check your connection.";btn.disabled=false}return}
  if(e.target.id==="regform"){doRegister();return}
  if(e.target.id==="manform"){const t=$("mtest").value,d=$("mdate").value,msg=$("manmsg");
    const items=t==="BP"?[{test:"Blood pressure (top)",value:+$("mv1").value,date:d},{test:"Blood pressure (bottom)",value:+$("mv2").value,date:d}]:[{test:t,value:t==="Period start"?0:+$("mv1").value,date:d}];
    try{await apiJSON("api/me/results",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({items,source:"Typed in"})});msg.textContent="Added ✓";e.target.reset();$("mvalwrap").innerHTML=manValHTML();P=await apiJSON("api/me");loadResults()}catch(x){msg.textContent=aiErr(x)}return}
  if(e.target.id==="repform"){const f=$("docfile").files[0],msg=$("repmsg");if(!f){msg.textContent="Choose a file first.";return}
    if(f.size>10*1024*1024){msg.textContent="That file is larger than 10 MB.";return}
    const fd=new FormData();fd.append("file",f);fd.append("title",f.name.replace(/\.[^.]+$/,""));fd.append("kind","Lab report");
    $("repbtn").disabled=true;msg.textContent="Uploading and reading…";
    try{const j=await apiJSON("api/me/documents",{method:"POST",body:fd});msg.textContent="Uploaded ✓ (also in Documents)";e.target.reset();pickedFile(null);if(j.found)showFound(j.found,"Lab report: "+j.title)}catch(x){msg.textContent=aiErr(x)}finally{$("repbtn").disabled=false}return}
  if(e.target.id==="docform"){const f=$("docfile").files[0],msg=$("docmsg");if(!f){msg.textContent="Choose a file first.";return}
    if(f.size>10*1024*1024){msg.textContent="That file is larger than 10 MB.";return}
    const fd=new FormData();fd.append("file",f);fd.append("title",$("doctitle").value);fd.append("kind",$("dockind").value);fd.append("doc_date",$("docdate").value);
    $("docbtn").disabled=true;msg.textContent="Uploading…";
    try{const up=await apiJSON("api/me/documents",{method:"POST",body:fd});msg.textContent=up.found&&up.found.values&&up.found.values.length?`Uploaded ✓ VitaLens found ${up.found.values.length} results in it. Go to My results to add them.`:"Uploaded ✓";e.target.reset();pickedFile(null);loadDocs()}catch(x){msg.textContent=aiErr(x)}finally{$("docbtn").disabled=false}return}
  if(e.target.id==="shareform"){const label=$("shlabel").value.trim()||"My doctor",hours=+$("shhours").value;
    try{const s=await apiJSON("api/me/shares",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({label,hours,approval:$("shapprove").checked})});$("shlabel").value="";
      $("newshare").innerHTML=`<div class="newshare"><b>Link ready for ${esc(s.label)}.</b> Send the link, then give the code separately.${s.approval?" When they open it, you'll be asked to approve them here.":""}<div class="urlbox" style="margin:8px 0">${esc(s.url)}</div><button type="button" class="btn sm" data-copy="${esc(s.url)}">Copy link</button>${codeHTML(s.code)}</div>`;
      await loadShares();loadLog();const q=$("qr-"+s.token);if(q)q.hidden=false}catch(x){alertBox(aiErr(x))}return}
  if(e.target.id==="contactform"){try{await apiJSON("api/me/profile",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({contact_name:$("cname").value,contact_phone:$("cphone").value,note:$("cnote").value})});
    EM.card.contact_name=$("cname").value;EM.card.contact_phone=$("cphone").value;EM.card.note=$("cnote").value;const l=$("cardlang").value;$("ecwrap").innerHTML=VLCard.render(EM.card,l,l==="en"?null:"en");$("cmsg").textContent="Saved ✓"}catch(x){$("cmsg").textContent=aiErr(x)}return}
  if(e.target.id==="askform"){const q=$("askq").value;$("askq").value="";doAsk(q)}
  if(e.target.id==="noteform"){const v=$("notein").value.trim();if(!v)return;const n=store.get("vl-notes-"+P.id,[]);n.push({t:v.slice(0,200),d:new Date().toISOString().slice(0,10)});store.set("vl-notes-"+P.id,n);$("notein").value="";$("notes").innerHTML=notesHTML(n)}});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.q!=null&&P){const q=e.target.dataset.q,s=store.get("vl-q-"+P.id,[]);const i=s.indexOf(q);if(e.target.checked&&i<0)s.push(q);if(!e.target.checked&&i>=0)s.splice(i,1);store.set("vl-q-"+P.id,s)}
  if(e.target.id==="lang")store.set("vl-lang",e.target.value);
  if(e.target.id==="cardlang"&&EM){const l=e.target.value;store.set("vl-cardlang",l);$("ecwrap").innerHTML=VLCard.render(EM.card,l,l==="en"?null:"en")}
  if(e.target.id==="docfile")pickedFile(e.target.files[0]);
  if(e.target.id==="mtest")$("mvalwrap").innerHTML=manValHTML();
  if(e.target.id==="remtime"){store.set("vl-remtime",e.target.value);$("remlink").href="api/me/reminder.ics?time="+encodeURIComponent(e.target.value)}
  if(e.target.id==="showpw")$("lpw").type=e.target.checked?"text":"password"});
$("lang").value=store.get("vl-lang","en");
boot();
})();
</script>
