<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VitaLens My Health</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap">
<style>
/* Layout: one calm column read top to bottom: language → greeting → what changed → one chart with "what is this" → meaning → questions */
:root{
  --bg:#F2F6F6; --card:#FFFFFF; --ink:#16282B; --muted:#56696D; --line:#D9E3E4;
  --accent:#137B7A; --accent-soft:#DDF0EE; --learn:#5B4BA8; --learn-soft:#ECE9F8;
  --up:#B4502A; --up-soft:#FBE9E1; --ok:#2F7A4B; --ok-soft:#E2F2E7; --season:#5F7FA6; --season-soft:#E5ECF5;
  --head:"Lexend", "Noto Sans Devanagari", "Noto Sans Gujarati", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Noto Sans Devanagari", "Noto Sans Gujarati", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --card:#172427; --ink:#E4EEEF; --muted:#9AB0B3; --line:#2A3B3E;
  --accent:#5CC4C0; --accent-soft:#173B3B; --learn:#B7AAF0; --learn-soft:#272240;
  --up:#F0956E; --up-soft:#3E2419; --ok:#7CCB97; --ok-soft:#183324; --season:#93AFD4; --season-soft:#1E2A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --card:#172427; --ink:#E4EEEF; --muted:#9AB0B3; --line:#2A3B3E;
  --accent:#5CC4C0; --accent-soft:#173B3B; --learn:#B7AAF0; --learn-soft:#272240;
  --up:#F0956E; --up-soft:#3E2419; --ok:#7CCB97; --ok-soft:#183324; --season:#93AFD4; --season-soft:#1E2A3A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.page{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(25px,5vw,31px);line-height:1.25}
h2{font-size:20px;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font-family:"Lexend",system-ui,sans-serif;font-weight:600;font-size:20px;display:flex;align-items:center;gap:8px}
.logo b{color:var(--accent);font-weight:600}
.badge{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.people{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 5px;font-size:15px}
.person i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:"Lexend",system-ui,sans-serif;font-weight:600;font-size:14px}
.person[aria-pressed="true"]{border-color:var(--accent)}

.langbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.langbar .lbl{font-size:14px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.lang{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 12px;font-size:16px}
.lang[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.speak{margin-left:auto;display:flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--card);border-radius:10px;padding:7px 14px;font-weight:700;font-size:15px}
.speak svg{width:18px;height:18px}
.speak-msg{font-size:13px;color:var(--muted);width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.hello{display:flex;flex-direction:column;gap:10px}
.hello .sub{color:var(--muted);font-size:16px}

.measures{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.m{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px}
.m.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.m:hover{border-color:var(--accent)}
.m .pick{width:100%;border:0;background:transparent;text-align:left;padding:16px 50px 16px 16px;display:flex;flex-direction:column;gap:6px;border-radius:12px}
.m .name{font-size:15px;color:var(--muted);font-weight:700;line-height:1.35}
.m .now{font-family:"Lexend",system-ui,sans-serif;font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.m .now small{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:400}
.m .usual{font-size:14px;color:var(--muted)}
.m .q{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:2px solid var(--learn);background:var(--learn-soft);color:var(--learn);font-weight:700;font-size:16px;display:grid;place-items:center;line-height:1}
.pill{align-self:flex-start;font-size:14px;font-weight:700;border-radius:999px;padding:3px 11px}
.pill.change{background:var(--up-soft);color:var(--up)}
.pill.same{background:var(--ok-soft);color:var(--ok)}
.hint{font-size:14px;color:var(--muted);margin-top:8px}

.chart-card{display:flex;flex-direction:column;gap:12px}
.chart-card .say{font-size:18px;font-weight:700}
.learn{background:var(--learn-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.learn .t{font-weight:700;color:var(--learn);display:flex;align-items:center;gap:8px}
.learn .t i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--learn);color:var(--learn-soft);display:grid;place-items:center;font-size:14px}
@media (prefers-reduced-motion:no-preference){.learn.flash{animation:flash .8s ease}@keyframes flash{0%{box-shadow:0 0 0 0 var(--learn)}100%{box-shadow:0 0 0 10px transparent}}}
#chart svg{display:block;width:100%;height:auto}
.key{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:16px;height:10px;border-radius:3px}

.why{background:var(--accent-soft);border:0}
.why p+p{margin-top:10px}
.word{margin-top:14px;background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px}
.word b{color:var(--learn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--card);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}
.docnote{margin-top:12px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.docnote b{display:block;font-size:14px;color:var(--muted);margin-bottom:2px}
.season-tag{display:inline-flex;align-items:center;gap:6px;background:var(--season-soft);color:var(--season);font-weight:700;font-size:14px;border-radius:999px;padding:3px 11px;margin-top:4px;align-self:flex-start}
.pill.season{background:var(--season-soft);color:var(--season)}
.pill.dip{background:var(--up-soft);color:var(--up)}
.asks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.asks label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.asks input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.muted{color:var(--muted);font-size:15px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
footer{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<div class="page">
  <div class="top">
    <div class="logo">Vita<b>Lens</b> <span class="badge" id="badge"></span></div>
    <div class="people" id="people" role="group" aria-label="Sample patients"></div>
  </div>

  <div class="langbar">
    <span class="lbl" id="lang-lbl"></span>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
    <button type="button" class="speak" id="speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span id="speak-txt"></span></button>
    <p class="speak-msg" id="speak-msg" hidden></p>
  </div>

  <section class="card hello">
    <h1 id="hello"></h1>
    <p class="sub" id="hello-sub"></p>
  </section>

  <section>
    <div class="measures" id="measures"></div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card chart-card" id="chart-card">
    <h2 id="chart-title"></h2>
    <p class="say" id="chart-say"></p>
    <div class="learn" id="learn"><span class="t"><i>?</i><span id="learn-t"></span></span><span id="learn-b"></span></div>
    <div id="chart"></div>
    <div class="key">
      <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i><span id="k1"></span></span>
      <span><i style="background:var(--accent)"></i><span id="k2"></span></span>
      <span><i style="background:var(--up)"></i><span id="k3"></span></span>
      <span><i style="background:var(--season)"></i><span id="k4"></span></span>
    </div>
  </section>

  <section class="card" id="ev-card">
    <h2 id="ev-t"></h2>
    <p id="ev-q" style="margin-top:8px"></p>
    <div class="chips" id="chips" role="group"></div>
    <p class="muted" id="ev-note" style="margin-top:12px"></p>
  </section>

  <section class="card" id="obs-card">
    <h2 id="obs-t"></h2>
    <p id="obs-q" style="margin-top:8px"></p>
    <div class="chips" id="obs-chips" role="group"></div>
    <p class="muted" id="obs-note" style="margin-top:12px"></p>
  </section>

  <section class="card why">
    <h2 id="why-t"></h2>
    <div id="why" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <h2 id="asks-t"></h2>
    <div class="docnote" id="docnote"></div>
    <p class="muted" id="asks-h" style="margin-top:12px"></p>
    <ul class="asks" id="asks"></ul>
  </section>

  <p class="note" id="note"></p>
  <footer id="foot"></footer>
</div>

<script>
(function(){
/* ---------------- words for each language ---------------- */
const L={
en:{label:"English",locale:"en-CA",speech:"en",
 months:["January","February","March","April","May","June","July","August","September","October","November","December"],
 short:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
 badge:"Prototype · sample data",langLbl:"Your language",read:"Read to me",stop:"Stop",
 noVoice:"This device has no voice for this language. Try Chrome or Edge, or add a voice in your device settings.",
 hello:(n,c)=>c?`Hi ${n}. ${c} ${c===1?"thing has":"things have"} changed from your usual.`:`Hi ${n}. Everything looks close to your usual.`,
 sub:c=>`We compared your last 2 months with your first 3 months (October to December 2025). `+(c?"Changes worth talking about are in orange.":"Nothing changed enough to point out."),
 usually:v=>`Usually ${v}`,up:"↑ Higher than usual",down:"↓ Lower than usual",same:"✓ Your usual",
 hint:"Tap a card to see it on the chart. Tap ? to learn what it means.",
 chartTitle:n=>`${n} over the year`,
 say:(n,m,a,up)=>`${n}: about ${a} ${up?"more":"less"} than usual since ${m}.`,
 sayPct:(n,m,a,up)=>`${n}: about ${a} ${up?"more":"fewer"} than usual since ${m}.`,
 saySame:n=>`${n}: inside your usual range all year.`,
 q:{weight:"What does weight tell me?",sleep:"What does sleep tell me?",steps:"What are daily steps?",hr:"What is resting heart rate?",bp:"What is blood pressure?"},
 k:["Your usual range","Your monthly average","Outside your usual"],
 obsT:"Do you fast or observe any of these?",
 obsQ:m=>`Some of your readings dipped for a short time around ${m}, then came back. Fasting and religious holidays can change sleep and weight. Tell us what you observe and VitaLens will take it into account.`,
 obsQ2:"Fasting and religious holidays can change sleep and weight. VitaLens takes what you observe into account.",
 obsNote:"You can change this at any time. VitaLens never guesses this from your name.",
 obs:{ramadan:"Ramadan",lent:"Lent",navratri:"Navratri",none:"None of these"},
 dipPill:"↺ Short dip, now back to usual",
 sayDip:(n,m)=>`${n}: dipped for a short time around ${m}, then came back to your usual. Did anything happen then? You can tell us below.`,

 docDip:(ms,m)=>`Short dips around ${m}: ${ms}. They came back on their own.`,

 evNote:"Your answers go into the note for your doctor. They help explain the change. They are not a diagnosis.",

 docT:"Note for your doctor",doc:(m,ms,ev)=>`Around ${m}: ${ms} changed. You said: ${ev}.`,docNone:(m,ms)=>`Around ${m}: ${ms} changed. Tap what was happening above to add your side of the story.`,docSeason:s=>`Seasonal changes this year: ${s}. These came back to normal, so they were not flagged.`,
 chartEv:"Your note",and:" and ",lower:true,
 seasons:{lent:"Lent",navratri:"Navratri",winter:"Winter",ramadan:"Ramadan",holidays:"Holidays"},
 seasonNote:n=>` Some dips earlier this year happened during ${n}. That is normal, so we did not flag them.`,
 saySeason:(n,s)=>`${n}: changed during ${s}, then came back to your usual. This is normal for that time of year, so we did not flag it.`,
 seasonPill:"~ Normal for the season",k4:"Normal for the season",
 whyT:"What this could mean",wordT:"What does this word mean?",asksT:"Questions to ask your doctor",asksH:"Tick the ones you want to ask.",

 p:[{rec:"Your blood sugar test (HbA1c) in September 2025 was 6.1%. That is a little above normal.",
     mean:"Your weight went up while your sleep and walking went down. These can affect blood sugar, so it is a good idea to show them to your doctor.",
     word:["HbA1c","A blood test that shows your average blood sugar over the last 2 to 3 months. Below 5.7% is normal."],
     asks:["Should I do my blood sugar test (HbA1c) again?","Could my sleep or walking be affecting my health?","What small changes would help me most?"]},
    {rec:"Your record says you have high blood pressure and take a medicine for it every day. You last picked up a refill from the pharmacy in April 2026.",

     word:["Refill","Getting more of your medicine from the pharmacy when it runs out."],
     asks:["Am I taking my blood pressure medicine the right way?","Do I need a refill or a different dose?","How often should I check my blood pressure at home?"]},
    {rec:"Your last check-up in September 2025 was normal.",
     mean:"All your readings stayed close to your usual this year. Keep doing what you are doing.",
     word:["Check-up","A regular visit to your doctor to make sure you are healthy, even when you feel fine."],
     asks:["Is there anything I should keep an eye on?","When should I have my next check-up?"]},
    {rec:"Your last check-up in August 2025 was normal.",told:" You told us you fast during Ramadan.",meanUnknown:"You walked less in winter, which is normal for that time of year. Your sleep and weight also dipped for a short time around March 2026, then came back. Right now everything is close to your usual.",asksUnknown:["Should I worry about short dips in my sleep or weight?","How can I stay active during the winter?"],
     mean:"You walked less in winter, and your sleep and weight dipped a little during Ramadan. That is normal for those times of year, and everything came back afterwards. Right now everything is close to your usual.",
     word:["Seasonal change","A change that happens at the same time every year, like walking less in winter. It is usually not a health problem."],
     asks:["What can I do to stay healthy while I fast?","How can I stay active during the winter?"]}]},

hi:{label:"हिन्दी",locale:"hi-IN",speech:"hi",
 months:["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"],
 badge:"प्रोटोटाइप · नमूना डेटा",langLbl:"आपकी भाषा",read:"सुनें",stop:"रोकें",
 noVoice:"इस डिवाइस पर इस भाषा की आवाज़ नहीं है। Chrome या Edge में खोलें, या डिवाइस की सेटिंग में आवाज़ जोड़ें।",
 hello:(n,c)=>c?`नमस्ते ${n}। ${c===1?"1 चीज़ आपके सामान्य से बदली है।":"आपकी "+c+" चीज़ें आपके सामान्य से बदली हैं।"}`:`नमस्ते ${n}। सब कुछ आपके सामान्य के आसपास है।`,

const PEOPLE=[

];
/* Times of year that often change readings. "all" applies to everyone in Canada; others only if the person observes them. */
const SEASONS=[
 {id:"winter",from:"2025-12-01",to:"2026-03-15",all:true,measures:{steps:-1,sleep:1}},
 {id:"holidays",from:"2025-12-20",to:"2026-01-02",all:true,measures:{weight:1}},

];
const OBS=["ramadan","lent","navratri","none"];
const ms=s=>{const a=s.split("-").map(Number);return Date.UTC(a[0],a[1]-1,a[2])};
const DAY=86400000;
const MONTHS=Array.from({length:12},(_,i)=>({m:(9+i)%12,year:2025+((9+i)>=12?1:0)}));

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}

/* Compare the last 2 months with the first 3 months ("your usual"), and explain dips that match a season */
function daysIn(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
function dipEffect(dp,t){const f=ms(dp.from),to=ms(dp.to),e=(dp.ease||7)*DAY;
  if(t<f||t>to+e)return 0;if(t<f+e)return dp.amt*(t-f)/e;if(t<=to)return dp.amt;return dp.amt*(1-(t-to)/e)}
function seasonsFor(p,k,i,dir,ob){const mo=MONTHS[i],a=Date.UTC(mo.year,mo.m,1),b=Date.UTC(mo.year,mo.m+1,1);
  return SEASONS.filter(se=>(se.all||ob.includes(se.id))&&se.measures[k]===dir&&
    (Math.min(b,ms(se.to)+DAY)-Math.max(a,ms(se.from)))/DAY>=10).map(se=>se.id)}
function analyse(p,idx,ob){
  const r=rng(idx*977+13),out={};
  for(const k of KEYS){
    const [from,amt]=p.drift[k]||[99,0],sp=SPEC[k],dips=(p.dips||[]).filter(x=>x.k===k);
    const months=MONTHS.map((mo,i)=>{const n=daysIn(mo.year,mo.m);let s=0;
      for(let d=0;d<n;d++){const t=Date.UTC(mo.year,mo.m,d+1),prog=Math.max(0,Math.min(1,(i+d/n-from)/3));
        s+=p.start[k]+amt*prog+dips.reduce((a,dp)=>a+dipEffect(dp,t),0)+sp.noise*gauss(r)}
      return s/n});
    const usual=(months[0]+months[1]+months[2])/3,now=(months[10]+months[11])/2;
    const tol=sp.pct?usual*sp.tol:sp.tol,diff=now-usual;
    const season=months.map((v,i)=>{const dv=v-usual;if(Math.abs(dv)<tol)return null;const se=seasonsFor(p,k,i,Math.sign(dv),ob);return se.length?se:null});

    let since=null;if(changed)for(let i=3;i<12;i++)if(Math.abs(months[i]-usual)>=tol&&!season[i]){since=i;break}
    const pastDips=[];for(let i=3;i<12;i++)if(Math.abs(months[i]-usual)>=tol&&!season[i]&&!(changed&&i>=since))pastDips.push(i);
    out[k]={months,usual,now,diff,tol,changed,since,season,dips:pastDips};
  }
  return out;
}
let obs=PEOPLE.map(()=>[]);
let DATA=[];const recompute=()=>{DATA=PEOPLE.map((p,i)=>analyse(p,i,obs[i]))};recompute();

/* ---------------- state ---------------- */

const seasonNames=(ids,inSentence)=>joinL(ids.map(id=>{const n=(inSentence&&T().seasonsIn&&T().seasonsIn[id])||T().seasons[id];return inSentence&&T().lower&&!(lang==="en"&&id==="ramadan")?n.toLowerCase():n}));

function chartSentence(){

  if(!x.changed&&x.dips.length)return t.sayDip(m[0],monthName(x.dips[0]));

  const amt=SPEC[k].pct?Math.abs(Math.round(x.diff/x.usual*100))+"%":`${num(k,Math.abs(x.diff))} ${m[1]}`;
  const f=SPEC[k].pct&&t.sayPct?t.sayPct:t.say;
  return f(m[0],monthName(x.since),amt,x.diff>0);
}

function drawChart(){

  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${m[0]}">`;
  s+=`<rect x="${ml}" y="${Y(hi0)}" width="${pw}" height="${Y(lo0)-Y(hi0)}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-opacity=".35"/>`;
  [hi0,x.usual,lo0].forEach(v=>{s+=`<text x="${ml-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--body)">${fmt(v)}</text>`});
  const XD=dt=>{for(let i=0;i<12;i++){const mo=MONTHS[i],a=Date.UTC(mo.year,mo.m,1),b=Date.UTC(mo.year,mo.m+1,1);if(dt<b)return ml+(i+Math.max(0,dt-a)/(b-a))*pw/12}return ml+pw};
  for(const id of seasonIds(k)){const se=SEASONS.find(z=>z.id===id),x1=XD(ms(se.from)),x2=XD(ms(se.to)+DAY);
    s+=`<rect x="${x1}" y="${mt}" width="${x2-x1}" height="${ph}" fill="var(--season)" opacity=".13"/><text x="${x1+4}" y="${mt-8}" font-size="12" font-weight="700" fill="var(--season)" font-family="var(--body)">${t.seasons[id]}</text>`}
  const info=changeInfo();
  if(info&&events[cur].length&&x.changed){const xe=ml+info.first*pw/12,lbl=`${t.chartEv}: ${t.ev[events[cur][0]]}${events[cur].length>1?" +"+(events[cur].length-1):""}`,end=xe>W*.6;
    s+=`<line x1="${xe}" x2="${xe}" y1="${mt-4}" y2="${mt+ph}" stroke="var(--ink)" stroke-dasharray="3 4" stroke-width="1.5"/><text x="${end?xe-6:xe+6}" y="${mt-8}" text-anchor="${end?"end":"start"}" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--body)">${lbl}</text>`}
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+ph}" y2="${mt+ph}" stroke="var(--line)"/>`;
  MONTHS.forEach((_,i)=>{if(i%every)return;s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--body)">${lab(i)}</text>`});
  s+=`<polyline points="${x.months.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  x.months.forEach((v,i)=>{const out=Math.abs(v-x.usual)>=x.tol,sea=!!x.season[i];s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${out?6:4.5}" fill="${sea?"var(--season)":out?"var(--up)":"var(--accent)"}" stroke="var(--card)" stroke-width="2"><title>${monthName(i)}: ${num(k,v)} ${m[1]}</title></circle>`});
  el.innerHTML=s+"</svg>";
}

/* ---------------- read aloud ---------------- */
let speaking=false;
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
if(!synth)$("speak").hidden=true;
function stopSpeak(){if(synth)synth.cancel();speaking=false;$("speak-txt").textContent=T().read}
function speak(){
  if(!synth)return;
  if(speaking){stopSpeak();return}
  const t=T(),tp=t.p[cur];
  const voices=synth.getVoices(),v=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(t.speech));
  if(voices.length&&!v&&lang!=="en"){$("speak-msg").textContent=t.noVoice;$("speak-msg").hidden=false;return}
  const text=[$("hello").textContent,$("chart-say").textContent,t.q[sel],t.m[sel][2],tp.rec,tp.mean].join(" ");
  const u=new SpeechSynthesisUtterance(text);u.lang=t.locale;if(v)u.voice=v;u.rate=.92;
  u.onend=u.onerror=()=>{speaking=false;$("speak-txt").textContent=T().read};
  synth.cancel();synth.speak(u);speaking=true;$("speak-txt").textContent=t.stop;
}
if(synth&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=()=>{};

/* ---------------- clicks ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="speak"){speak();return}
  if(b.dataset.lang){stopSpeak();lang=b.dataset.lang;try{localStorage.setItem("vl-lang",lang)}catch(err){}render();return}
  if(b.dataset.obs){const o=b.dataset.obs,list=obs[cur];
    if(o==="none")obs[cur]=list.includes("none")?[]:["none"];
    else{const l=list.filter(x=>x!=="none");obs[cur]=l.includes(o)?l.filter(x=>x!==o):[...l,o]}
    recompute();render();return}
  if(b.dataset.ev){const e=b.dataset.ev,list=events[cur];
    if(e==="none")events[cur]=list.includes("none")?[]:["none"];
    else{const l=list.filter(x=>x!=="none");events[cur]=l.includes(e)?l.filter(x=>x!==e):[...l,e]}
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",events[cur].includes(c.dataset.ev)));
    renderEvents();drawChart();return}
  if(b.dataset.i!=null){stopSpeak();cur=+b.dataset.i;sel=null;render();return}
  const k=b.dataset.k||b.dataset.learn;
  if(k){sel=k;document.querySelectorAll(".m").forEach(n=>{const on=n.querySelector(".pick").dataset.k===sel;n.classList.toggle("on",on);n.querySelector(".pick").setAttribute("aria-pressed",on)});drawChart();
    if(b.dataset.learn){const l=$("learn");l.classList.remove("flash");void l.offsetWidth;l.classList.add("flash");$("chart-card").scrollIntoView({behavior:"smooth",block:"start"})}}
});
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(drawChart,120)});
render();
})();
</script>
